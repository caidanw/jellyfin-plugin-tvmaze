changelog: |-
  Fork of jellyfin-plugin-tvmaze v13 for Jellyfin 10.11:
  - Match the TVmaze provider ID key without regard to case
  - Use the TvMaze Season ID and Episode ID if known (upstream #65)
  - Update TvMaze.Api.Client to 0.1.84
  - Populate season overview and end date
  - Fix episode runtime units and add episode community rating
  - Use the web channel as studio, fall back to average runtime
  - Populate series end date, air time and days, official site
  - Add series creator and composer credits
